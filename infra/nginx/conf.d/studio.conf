server {
    listen 80;
    server_name studiocarlustyles.com.br www.studiocarlustyles.com.br localhost;

    include /etc/nginx/snippets/compression.conf;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 8M;

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://fastapi:8001;
    }

    location /admin/ {
        return 404;
    }

    location /acesso-operacional-carlu-2026/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django:8000;
    }

    location /django-health/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://django:8000;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://frontend:4173;
    }
}
