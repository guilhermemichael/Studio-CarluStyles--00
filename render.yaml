services:
  - type: web
    name: api-studio-carlu
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: api-studio-carlu.onrender.com,api.studiocarlustyles.com.br
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://api-studio-carlu.onrender.com,https://api.studiocarlustyles.com.br
      - key: CORS_ALLOWED_ORIGINS
        value: https://studio-carlu-styles.vercel.app,https://studiocarlustyles.com.br,https://www.studiocarlustyles.com.br
      - key: DATABASE_URL
        fromDatabase:
          name: studio-carlu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studio-carlu-redis
          property: connectionString
      - key: WHATSAPP_URL
        value: https://wa.me/5583981580195?text=Ol%25C3%25A1%252C+gostaria+de+agendar+um+hor%25C3%25A1rio%2521+
      - key: INSTAGRAM_URL
        value: https://www.instagram.com/studio_carlustyles?igsh=bjZyOWFqdW80cm9j
      - key: GOOGLE_MAPS_URL
        value: https://maps.app.goo.gl/TzdoJmZgWnTHzkNh9?g_st=ic

  - type: keyvalue
    name: studio-carlu-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: studio-carlu-postgres
    databaseName: studiocarlu
    user: studiocarlu
    plan: free
    region: oregon
