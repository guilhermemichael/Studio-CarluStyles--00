services:
  - type: web
    name: studio-carlu-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: studio-carlu-backend.onrender.com,api.studiocarlustyles.com.br
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://studio-carlu-backend.onrender.com,https://api.studiocarlustyles.com.br
      - key: CORS_ALLOWED_ORIGINS
        value: https://studiocarlustyles.com.br,https://www.studiocarlustyles.com.br
      - key: DATABASE_URL
        fromDatabase:
          name: studio-carlu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studio-carlu-redis
          property: connectionString
      - key: WHATSAPP_NUMBER
        sync: false
      - key: INSTAGRAM_URL
        value: https://www.instagram.com/studio_carlustyles
      - key: GOOGLE_MAPS_URL
        sync: false

  - type: keyvalue
    name: studio-carlu-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: studio-carlu-postgres
    databaseName: studiocarlu
    user: studiocarlu
    plan: free
    region: oregon
